[package]
name = "flashbang"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
openrgb2 = { path = "vendor/openrgb2" }
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["full"] }
use = "0.0.1-pre.0"
anchor-sdk = { path = "vendor/anchor-sdk/rust" }
rcgen = "0.14.7"
uuid = {version = "1.21.0", features = ["v4"]}
quinn = "0.11"
rustls = "0.23"
rustls-pemfile = "2"
sha2 = "0.10"
base64 = "0.23.1"
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
dirs = "7.0.0"
yaml_serde = "0.10"
mdns-sd = "0.13"
